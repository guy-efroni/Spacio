<div class="app-layout">
  <header class="app-header">
    <div class="app-header__brand">
      <svg class="app-header__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      <span class="app-header__title">Spacio</span>
    </div>

    <div class="app-header__stats">
      <div class="app-header__stat">
        <span class="app-header__stat-value">{{ wallCount() }}</span>
        <span class="app-header__stat-label">Walls</span>
      </div>
      <div class="app-header__stat-divider"></div>
      <div class="app-header__stat">
        <span class="app-header__stat-value">{{ roomArea() | number:'1.0-2' }}</span>
        <span class="app-header__stat-label">m²</span>
      </div>
    </div>

    <div class="app-header__actions">
      <button
        type="button"
        class="app-header__button"
        (click)="_onResetRoom()"
        title="Reset to default room"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="app-floating-toolbar" [class.app-floating-toolbar--active]="viewportComponent.isDrawingModePublic()">
      <div class="app-floating-toolbar__group">
        <button
          type="button"
          class="app-floating-toolbar__button"
          [class.app-floating-toolbar__button--active]="!viewportComponent.isDrawingModePublic() && !viewportComponent.isRulerModePublic()"
          (click)="viewportComponent.setToolMode(ViewportToolMode.View)"
          title="Select / Orbit (V)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 11V6a2 2 0 00-2-2v0a2 2 0 00-2 2v0" />
            <path d="M14 10V4a2 2 0 00-2-2v0a2 2 0 00-2 2v10" />
            <path d="M10 10.5V6a2 2 0 00-2-2v0a2 2 0 00-2 2v8" />
            <path d="M18 8a2 2 0 114 0v6a8 8 0 01-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 012.83-2.82L7 15" />
          </svg>
        </button>
        <button
          type="button"
          class="app-floating-toolbar__button"
          [class.app-floating-toolbar__button--active]="viewportComponent.isDrawingModePublic()"
          (click)="viewportComponent.onAddInteriorWall()"
          title="Add Wall (W)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v18" />
            <path d="M3 12h18" />
            <path d="M12 3a6 6 0 016 6v6" />
            <path d="M12 21a6 6 0 01-6-6v-6" />
          </svg>
        </button>
        <button
          type="button"
          class="app-floating-toolbar__button"
          [class.app-floating-toolbar__button--active]="viewportComponent.isRulerModePublic()"
          (click)="viewportComponent.onToggleRuler()"
          title="Ruler / Measure (M)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3h18v18H3z" />
            <path d="M3 9h18" />
            <path d="M3 15h18" />
            <path d="M9 3v18" />
            <path d="M15 3v18" />
            <path d="M7 7l4 4" />
            <path d="M13 7l4 4" />
            <path d="M7 13l4 4" />
            <path d="M13 13l4 4" />
          </svg>
        </button>
      </div>

      <div class="app-floating-toolbar__divider"></div>

      <div class="app-floating-toolbar__group">
        <button
          type="button"
          class="app-floating-toolbar__button"
          (click)="viewportComponent.onRemoveLastWall()"
          title="Undo / Remove Last Wall (Z)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6" />
            <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13" />
          </svg>
        </button>
        <button
          type="button"
          class="app-floating-toolbar__button app-floating-toolbar__button--danger"
          [disabled]="!floorplanService.selectedWallId()"
          (click)="viewportComponent.onDeleteSelectedWall()"
          title="Delete Selected Wall (Del)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
          </svg>
        </button>
      </div>

      <div class="app-floating-toolbar__divider"></div>

      <div class="app-floating-toolbar__group">
        <button
          type="button"
          class="app-floating-toolbar__button"
          title="Top View (1)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M9 3v18" />
            <path d="M15 3v18" />
            <path d="M3 9h18" />
            <path d="M3 15h18" />
          </svg>
        </button>
        <button
          type="button"
          class="app-floating-toolbar__button"
          title="Perspective View (2)"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5" />
            <path d="M12 22V12" />
            <path d="M22 15.5L12 9" />
            <path d="M2 15.5L12 9" />
          </svg>
        </button>
      </div>
    </div>

    <section class="app-viewport-host">
      <app-viewport #viewportComponent></app-viewport>
    </section>

    @if (floorplanService.selectedWallId()) {
      <aside class="app-inspector-panel">
        <app-property-inspector></app-property-inspector>
      </aside>
    }
  </main>
</div>
