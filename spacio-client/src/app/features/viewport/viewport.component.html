<div class="viewport-container" [class.viewport-container--drawing]="isDrawingMode()"></div>
@if (isDrawingMode() && ghostBadgePosition()) {
  <div
    class="ghost-length-badge"
    [style.left.px]="ghostBadgePosition()!.x"
    [style.top.px]="ghostBadgePosition()!.y"
  >
    {{ ghostBadgeLength() }}
  </div>
}
